# Builds the Docker image after CI passes on main, pushes it to GHCR
# and deploys it by updating the image tag in dariuszpaluch/homelab (Portainer GitOps).
name: Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/obsidian-mcp

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image tag from commit
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Fine-grained token: Contents read/write on dariuszpaluch/homelab only
      HOMELAB_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Skip without token
        if: env.HOMELAB_TOKEN == ''
        run: echo "::warning::HOMELAB_TOKEN not set - image pushed, homelab not updated"

      - name: Checkout homelab
        if: env.HOMELAB_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: dariuszpaluch/homelab
          token: ${{ secrets.HOMELAB_TOKEN }}

      - name: Update image tag
        if: env.HOMELAB_TOKEN != ''
        run: |
          sed -i -E "s#(image: ghcr.io/dariuszpaluch/obsidian-mcp:)[^ ]+#\1${TAG}#" stacks/notes/compose.yml
          if git diff --quiet; then
            echo "Already on ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy notes-mcp ${TAG}"
          git push
